<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Angular Lab — Project Dashboard</title>
    <!--
      [Angular — Router] `base href`
      Contexte : le routeur doit construire ses URL à partir de la racine de l’application.
      Objectif : déclarer le préfixe utilisé par la navigation.
      Justification : cet élément est requis pour que les liens et la stratégie de chargement des routes fonctionnent.
    -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Laboratoire Angular pratique sur les Signals, les formulaires réactifs et l'architecture frontend."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Icons+Round&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
