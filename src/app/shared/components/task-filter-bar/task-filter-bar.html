<section class="filters" aria-label="Filtres des tâches">
  <mat-form-field appearance="outline" class="filters__search">
    <mat-label>Rechercher une tâche</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input matInput type="search" [value]="searchTerm()" (input)="updateSearch($event)" />
    @if (searchTerm()) {
      <button
        matIconButton
        matSuffix
        type="button"
        aria-label="Effacer la recherche"
        (click)="searchTerm.set('')"
      >
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Statut</mat-label>
    <mat-select [value]="statusFilter()" (selectionChange)="updateStatus($event.value)">
      @for (option of statusOptions; track option.value) {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <span class="filters__count">{{ resultCount() }} résultat(s)</span>
  <button matButton type="button" (click)="clearFilters()">
    <mat-icon>filter_alt_off</mat-icon>
    Réinitialiser
  </button>
</section>
