<mat-card class="stat-card" [attr.data-tone]="tone()">
  <mat-card-header>
    <div mat-card-avatar class="stat-card__icon">
      <mat-icon>{{ icon() }}</mat-icon>
    </div>
    <mat-card-title>{{ label() }}</mat-card-title>
    <mat-card-subtitle>{{ hint() }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <strong class="stat-card__value">{{ displayValue() }}</strong>
  </mat-card-content>
</mat-card>
